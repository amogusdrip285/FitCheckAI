name: Proxy CI

on:
  pull_request:
    paths: ["proxy/**", "data/sources/garment-types.json"]
  push:
    branches: [main]
    paths: ["proxy/**", "data/sources/garment-types.json"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: proxy/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
