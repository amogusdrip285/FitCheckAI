name: Android CI

on:
  pull_request:
    paths-ignore: ["proxy/**", "docs/**", "eval/**", "**.md"]
  push:
    branches: [main]
    paths-ignore: ["proxy/**", "docs/**", "eval/**", "**.md"]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate licensed clothing fixtures
        run: |
          python -m pip install -r tools/data/requirements.txt
          python tools/data/validate_fixtures.py
      - name: Build, unit test, lint
        run: ./gradlew assembleDebug testDebugUnitTest :core:model:test lintDebug :core:database:verifyDatabaseCoverage --console=plain
      - name: Upload test and database coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            **/build/reports/tests/
            core/database/build/reports/jacoco/
          retention-days: 7
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
